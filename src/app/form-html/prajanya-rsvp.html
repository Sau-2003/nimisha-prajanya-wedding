<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding RSVP - Travel Details</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap');

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: 'Lato', sans-serif;
      background: linear-gradient(rgba(247, 241, 237, 0.85), rgba(247, 241, 237, 0.85)), url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a4a4a;
      box-sizing: border-box;
    }

    .rsvp-card {
      background: #ffffff;
      padding: 3rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      text-align: center;
      border: 1px solid #f0e9e4;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #2c3e50;
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    p.subtitle {
      font-style: italic;
      color: #7f8c8d;
      margin-bottom: 2rem;
      font-family: 'Playfair Display', serif;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .form-row {
      display: flex;
      gap: 1rem;
    }

    .form-row .form-group {
      flex: 1;
    }

    .section-title {
      text-align: left;
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: #d4af37;
      margin: 1.5rem 0 1rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.5rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #34495e;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="number"],
    input[type="tel"],
    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
      box-sizing: border-box;
      transition: border-color 0.3s;
      background-color: #fafafa;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
      background-color: #fff;
    }

    button {
      background: #2c3e50;
      color: white;
      border: none;
      padding: 15px 20px;
      width: 100%;
      font-size: 1.1rem;
      font-family: 'Playfair Display', serif;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      margin-top: 1.5rem;
    }

    button:hover {
      background: #1a252f;
    }

    button:active {
      transform: scale(0.98);
    }

    .success-message {
      display: none;
      color: #27ae60;
      font-weight: bold;
      margin-top: 2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Hidden iframe prevents redirect -->
  <script type="text/javascript">var submitted=false;</script>
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { document.getElementById('rsvp-form').style.display='none'; document.getElementById('success-msg').style.display='block'; window.scrollTo(0,0); }"></iframe>

  <div class="rsvp-card">
    <h1>Kindly RSVP</h1>
    <p class="subtitle">Please share your availability with us</p>

    <!-- Action URL points to formResponse -->
    <form id="rsvp-form" action="https://docs.google.com/forms/d/e/1FAIpQLSd1hcMj5I4TplzX1tsj65pw9UJwZ6vurnQyRTKR-Pyy_rmvyw/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
      
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="entry.875929226" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="count">No. of People</label>
          <input type="number" id="count" name="entry.691989859" required min="1">
        </div>
        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" name="entry.991186990" required>
        </div>
      </div>

      <div class="form-group">
        <label for="origin">City of Origin</label>
        <input type="text" id="origin" name="entry.492631262" >
      </div>

      <div class="section-title">Arrival</div>

      <div class="form-row">
        <div class="form-group">
          <label for="arr-date">Date</label>
          <input type="date" id="arr-date" name="entry.870500916" >
        </div>
        <div class="form-group">
          <label for="arr-time">Time</label>
          <input type="time" id="arr-time" name="entry.1818082565" >
        </div>
      </div>

      <div class="form-group">
        <label for="arr-trans">Transportation </label>
        <input type="text" id="arr-trans" name="entry.1214409913" placeholder="" >
      </div>

      <div class="section-title">Departure</div>

      <div class="form-row">
        <div class="form-group">
          <label for="dep-date">Date</label>
          <input type="date" id="dep-date" name="entry.2065851962" >
        </div>
        <div class="form-group">
          <label for="dep-time">Time</label>
          <input type="time" id="dep-time" name="entry.618414853" >
        </div>
      </div>

      <div class="form-group">
        <label for="dep-trans">Transportation </label>
        <input type="text" id="dep-trans" name="entry.1850595196" placeholder="" >
      </div>

      <button type="submit">Submit Travel Details</button>
    </form>

    <div id="success-msg" class="success-message">
      Thank you! Your RSVP has been received. <br><br> We can't wait to celebrate with you.
    </div>
  </div>

</body>
</html>
